# 3D adaptive tokens: APT-2D in space (2/4/8 px by entropy) + RLT in time (tau 0.2), full fold I, 1 seed, 200 epochs.
# Same settings as flex_20pct / apt_20pct / rlt_20pct. apt_tau = [tau4, tau8], from apt_stats.py --rlt-tau 0.2 (20% train):
#   [2.15, 2.22] -> ~2,162 tokens (= patch 4 budget, 0.613); area 8/4/2 px = 25/26/49 %
#   [2.25, 2.34] -> ~1,274 tokens (same space split as apt_b2144 + RLT); area 8/4/2 px = 50/26/24 %
name: apt3d_full

base:
  model.tokenizer: patch2d
  model.tubelet_t: 1
  model.patch_size: 2
  model.attention: joint
  model.pe_mode: add
  model.spatial_pe: sinusoidal
  model.temporal_enc: doy_sin
  model.rlt_tau: 0.2
  model.rlt_date: start
  model.rlt_len_enc: learned
  model.dropout: 1.0e-01
  model.drop_path: 1.0e-01
  train.optimizer: sgd
  train.lr: 1.0e-01
  train.weight_decay: 5.0e-04
  train.augment: flip_date
  train.label_smoothing: 0.0e+00
  train.loss: weighted_ce
  train.epochs: 200
  train.seed: 42
  data.subset_fraction: 1.0
  data.fold_run: I
  data.num_workers: 6

runs:
  - {id: apt3d_b2162_full, model.apt_tau: [2.15, 2.22]}
