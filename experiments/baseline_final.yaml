# STAGE B: confirm the sweep winners with 3 seeds (baseline ViT, 5% subset, 100 epochs).
name: baseline_vit

base:
  model.tokenizer: patch2d
  model.patch_size: 4
  model.tubelet_t: 1
  model.attention: joint
  model.spatial_pe: learnable
  model.temporal_enc: doy_sin
  data.subset_fraction: 0.05

runs:
  - {id: ref, train.seed: 42}
  - {id: ref, train.seed: 1}
  - {id: ref, train.seed: 2}
  - {id: tuned_adamw, train.seed: 42, model.dropout: 0.1, model.drop_path: 0.1, train.weight_decay: 0.05, train.loss: weighted_ce}
  - {id: tuned_adamw, train.seed: 1,  model.dropout: 0.1, model.drop_path: 0.1, train.weight_decay: 0.05, train.loss: weighted_ce}
  - {id: tuned_adamw, train.seed: 2,  model.dropout: 0.1, model.drop_path: 0.1, train.weight_decay: 0.05, train.loss: weighted_ce}
  - {id: tuned_sgd, train.seed: 42, train.optimizer: sgd, train.lr: 1.0e-2, model.dropout: 0.1, model.drop_path: 0.1, train.weight_decay: 0.05, train.loss: weighted_ce}
  - {id: tuned_sgd, train.seed: 1,  train.optimizer: sgd, train.lr: 1.0e-2, model.dropout: 0.1, model.drop_path: 0.1, train.weight_decay: 0.05, train.loss: weighted_ce}
  - {id: tuned_sgd, train.seed: 2,  train.optimizer: sgd, train.lr: 1.0e-2, model.dropout: 0.1, model.drop_path: 0.1, train.weight_decay: 0.05, train.loss: weighted_ce}
