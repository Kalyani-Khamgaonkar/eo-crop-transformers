# FlexiViT on full data, fold I, 1 seed, final hyperparameters, joint attention, 200 epochs.
# Run 0: one 2D model trained with patch size 2, 3, 4, 6, 8 or 12 (picked per step); base 4.
# Runs 1-6: separate models, each trained at one patch size (reference for FlexiViT).
# Score FlexiViT at every size: python scripts/eval_flex.py experiments/flex_full.yaml
name: flex_full

base:
  model.tokenizer: patch2d
  model.tubelet_t: 1
  model.attention: joint
  model.pe_mode: add
  model.spatial_pe: sinusoidal
  model.temporal_enc: doy_sin
  model.dropout: 1.0e-01
  model.drop_path: 1.0e-01
  train.optimizer: sgd
  train.lr: 1.0e-01
  train.weight_decay: 5.0e-04
  train.augment: flip_date
  train.label_smoothing: 0.0e+00
  train.loss: weighted_ce
  train.epochs: 200
  train.seed: 42
  data.subset_fraction: 1.0
  data.fold_run: I
  data.num_workers: 6

runs:
  - {id: flexvit_2d_full, model.patch_size: 4, model.flex_patch: [2, 3, 4, 6, 8, 12]}
  - {id: fixed_2d_p2_full, model.patch_size: 2}
  - {id: fixed_2d_p3_full, model.patch_size: 3}
  - {id: fixed_2d_p4_full, model.patch_size: 4}
  - {id: fixed_2d_p6_full, model.patch_size: 6}
  - {id: fixed_2d_p8_full, model.patch_size: 8}
  - {id: fixed_2d_p12_full, model.patch_size: 12}
