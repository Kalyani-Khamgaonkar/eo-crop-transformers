# Stage 1 grid: optimiser x LR x weight decay, 5% subset, run I
name: hp_stage1

base:
  model.tokenizer: patch2d
  model.patch_size: 4
  model.tubelet_t: 1
  model.attention: joint
  model.spatial_pe: learnable
  model.temporal_enc: doy_sin
  model.dropout: 0.1
  model.drop_path: 0.1
  train.loss: weighted_ce
  data.subset_fraction: 0.05
  data.num_workers: 6

